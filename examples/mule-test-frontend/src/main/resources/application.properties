# Spring Boot Logging Configuration
# Enable DEBUG logging for Muse engine and HTTP connectors
logging.level.dev.museframework.engine.execution=DEBUG
logging.level.dev.museframework.engine.components.router=DEBUG
logging.level.dev.museframework.connectors.http.processor=DEBUG
logging.level.dev.museframework.connectors.http.spring=DEBUG
logging.level.dev.museframework.connectors.http=DEBUG

# Pattern: timestamp level [thread] logger: message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %c{0}: %m%n

# Log file (optional - uncomment to enable)
# logging.file.name=logs/mule-test-frontend.log
# logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %c{0}: %m%n

# Use virtual threads for pipeline coroutines (default, set to "platform" to opt out)
muse.coroutine.dispatcher=virtual
