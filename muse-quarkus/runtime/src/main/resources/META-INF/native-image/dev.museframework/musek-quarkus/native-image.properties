# DataWeave exposes immutable parser constants during image analysis, while its
# random generator and Cleaner-backed byte manager must be created at runtime.
Args = --initialize-at-build-time=org.mule.weave.v2.parser.ast.variables.NameIdentifier,scala.None$ \
       --initialize-at-run-time=scala.util.Random,scala.util.Random$,org.mule.weave.v2.core.io.RandomAccessBytesManager$,org.mule.weave.v2.sdk.SPIBasedModuleLoaderProvider$
