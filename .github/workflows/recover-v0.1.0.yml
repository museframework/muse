name: Recover Muse 0.1.0 Central deployment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type upload-v0.1.0 to authorize a new Central Portal deployment'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: recover-muse-v0.1.0
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'upload-v0.1.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout original release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v0.1.0
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release sources
        shell: bash
        run: |
          set -euo pipefail
          expected_commit="ee74ebbb06583f2370d098e9bbfe315c33ea6b1a"
          actual_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse 'refs/tags/v0.1.0^{commit}')"
          if [[ "$actual_commit" != "$expected_commit" || "$tag_commit" != "$expected_commit" ]]; then
            echo "Release tag changed or unexpected checkout: $actual_commit / $tag_commit" >&2
            exit 1
          fi

      - name: Set up JDK 21 and signing
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Verify release version and plugin override
        shell: bash
        run: |
          set -euo pipefail
          version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          publisher="$(mvn help:evaluate -Dexpression=central-publishing-maven-plugin.version -Dcentral-publishing-maven-plugin.version=0.12.0 -q -DforceStdout)"
          [[ "$version" == "0.1.0" && "$publisher" == "0.12.0" ]]

      - name: Build and verify original release sources
        run: >-
          mvn clean verify --batch-mode
          -Dcentral-publishing-maven-plugin.version=0.12.0
          -Dkotlin.daemon.enabled=false

      - name: Upload corrected bundle to Central Portal (manual publication)
        run: >-
          mvn deploy --batch-mode -Prelease -DskipTests
          -Dcentral-publishing-maven-plugin.version=0.12.0
          -Dkotlin.daemon.enabled=false
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
