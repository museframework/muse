name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag points to main head
        shell: bash
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          main_commit="$(git rev-parse refs/remotes/origin/main)"

          if [[ "$tag_commit" != "$main_commit" ]]; then
            echo "Release tag commit '$tag_commit' does not match main head '$main_commit'" >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Verify tagged release version
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"

          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag '$GITHUB_REF_NAME' is not a stable semantic version" >&2
            exit 1
          fi

          project_version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"

          if [[ -z "$release_version" || "$project_version" != "$release_version" ]]; then
            echo "Tag version '$release_version' does not match POM version '$project_version'" >&2
            exit 1
          fi

          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and verify
        run: mvn clean verify --batch-mode -Dkotlin.daemon.enabled=false

      - name: Publish to Maven Central
        run: mvn deploy --batch-mode -Prelease -DskipTests -Dkotlin.daemon.enabled=false
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
